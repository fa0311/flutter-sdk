# mise configuration for Flutter with the patched engine (copy into your mise.toml).
# The Flutter SDK stays official (mise's registry `flutter`); the engine artifacts,
# bin/cache/dart-sdk and the Android Maven artifacts come from the patched mirror
# (release flutter-<version>-emudhra) served on localhost by the task below.
#
#   mise install
#   mise run emudhra-mirror                                       # terminal 1: downloads the mirror once, then serves it
#   rm -f "$(mise where flutter)/bin/cache/engine-dart-sdk.stamp"  # terminal 2, once
#   flutter precache --force --android                            # engine artifacts from the mirror
#   flutter --version                                             # re-fetches bin/cache/dart-sdk from the mirror
#   flutter build apk --release
[tools]
flutter = "3.47.7"

[env]
FLUTTER_STORAGE_BASE_URL = "http://127.0.0.1:8181"

[tasks.emudhra-mirror]
description = "Serve the patched Flutter engine mirror on 127.0.0.1:8181 (downloads it once; keep running while using flutter)"
run = "curl -fsSL https://raw.githubusercontent.com/fa0311/flutter-sdk-eMudhra/main/emudhra/flutter_mirror.py | python3 - --release 3.47.7"
